name: Release

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省时回退到
# 内置 GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 注意：仓库没有 lockfile，setup-node 不能开 cache: npm（会因找不到锁文件而失败）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 不安装依赖：node --check 与 npm pack 都不需要 node_modules；而 npm
      # 默认会自动安装 root peer（@deepseek-ai/dsh 整棵闭包），与
      # dsh-typert-protocol 的 caret 区间发生 ERESOLVE 冲突秒失败（v1.5.0
      # 首次发布踩过）。
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-token-stats + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # 同样不安装依赖：npm publish 只打 files 声明的文件，无 prepack/prepare。
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # npm pack 产物名用 package.json 版本号（不带 v 前缀），与标签 ref_name 不同。
      - name: Resolve asset name
        id: asset
        run: echo "tgz=duke-dsh-plugins-dsh-token-stats-${GITHUB_REF_NAME#v}.tgz" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-token-stats — DeepSeek Harness Token 用量统计插件。

            ### 功能
            - 近 7 天 / 近 30 天（均含今天）：每日按模型消耗的堆叠柱状图 + 模型总消耗饼图。
            - GitHub 风格「近一年」每日活跃热力图（随容器宽度自适应天数，最多 365 天）。
            - 💰 套餐余额：会话输入框工具行（模型选择器左侧）内联显示当前 provider 的余额/用量（DeepSeek/OpenRouter 余额，MiniMax/Kimi/智谱 5h+7d 窗口，小米 MiMo Token Plan 套餐+本月），跟随当前模型自动切换，点击立即刷新（参考 [dsh-musage](https://github.com/Thedeergod666/dsh-musage)，MIT）。
            - 设置页新增「套餐余额」区块：所有已配置 API Key 的 provider 一行一张余额卡片。
            - 数据来源为 DSH 会话日志（`assistant/message` 的 usage），按天/按模型聚合，历史自动回填。
            - 设置导航图标：DSH 0.2.2-rc.1+ 走官方 `settings.section.icon` 槽贡献自定义图标，同时兼容旧外壳（修复升级后「自定义图标 + 核心齿轮」双图标）。
            - 🆕 OpenCode Go 套餐用量：走官方 `opencode.ai/zen/go/v1/usage` 接口，显示 5h / 7d / 30d 三个窗口的已用百分比；未配置 API Key 时与其他 provider 同规则（不显示）。
            - 🆕 阿里云百炼 Token Plan（个人版）：AK/SK 纯 HTTP 通道（ACS3 签名换 CLI access token → 控制台网关），免 Cookie、自动续期；设置页新增「百炼 Token Plan 凭据」卡片（仅在已配置 qwen token plan 模型时出现），可保存/更换/清除 RAM AK/SK；显示订阅月已用百分比、重置倒计时、套餐剩余天数与加购包余额。附 `npm run fix:bailian-workspace` 修复 RAM 子账号「未加入业务空间」导致的 NotAuthorised。
            - 🆕 缓存命中率：汇总卡新增第 4 张「缓存命中率」= cacheRead / (未缓存输入 + cacheRead)，随 7/30 天 Tab 切换；柱状图悬停追加当天命中率。
            - 🆕 套餐读数按 provider 开关：设置页每张配额卡头部开关，隐藏后 composer 整行消失、host 不再请求该 provider 接口；偏好持久化跨重启生效，凭据不受影响。
            - 🆕 图例与悬停显示「模型 · provider」：同一模型挂多个渠道时可区分调用来源（无 provider 信息时回退纯模型名）。
            - 🛠 修复 fork/派生会话历史重复累加：按 DSH 继承切点（inheritedEventCount / end-seed 标记）跳过复制的父会话前缀；升级后首次启动自动全量重扫，修复已被污染的历史统计。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            # 注意 scoped 包 npm pack 产物名带 scope 前缀、版本号不带 v
            dsh plugin --profile web add ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.asset.outputs.tgz }}
            # 重启 DSH 后，设置面板出现「Token 统计」页
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
