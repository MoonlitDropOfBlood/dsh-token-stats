name: Release

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省时回退到
# 内置 GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 注意：仓库没有 lockfile，setup-node 不能开 cache: npm（会因找不到锁文件而失败）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 不安装依赖：node --check 与 npm pack 都不需要 node_modules；而 npm
      # 默认会自动安装 root peer（@deepseek-ai/dsh 整棵闭包），与
      # dsh-typert-protocol 的 caret 区间发生 ERESOLVE 冲突秒失败（v1.5.0
      # 首次发布踩过）。
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-token-stats + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # 同样不安装依赖：npm publish 只打 files 声明的文件，无 prepack/prepare。
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-token-stats — DeepSeek Harness Token 用量统计插件。

            ### 功能
            - 近 7 天 / 近 30 天（均含今天）：每日按模型消耗的堆叠柱状图 + 模型总消耗饼图。
            - GitHub 风格「近一年」每日活跃热力图（随容器宽度自适应天数，最多 365 天）。
            - 💰 套餐余额：会话输入框工具行（模型选择器左侧）内联显示当前 provider 的余额/用量（DeepSeek/OpenRouter 余额，MiniMax/Kimi/智谱 5h+7d 窗口），跟随当前模型自动切换，点击立即刷新（参考 [dsh-musage](https://github.com/Thedeergod666/dsh-musage)，MIT）。
            - 设置页新增「套餐余额」区块：所有已配置 API Key 的 provider 一行一张余额卡片。
            - 数据来源为 DSH 会话日志（`assistant/message` 的 usage），按天/按模型聚合，历史自动回填。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            # 注意 scoped 包 npm pack 产物名带 scope 前缀
            dsh plugin --profile web add ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/duke-dsh-plugins-dsh-token-stats-${{ github.ref_name }}.tgz
            # 重启 DSH 后，设置面板出现「Token 统计」页
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
